[package]
name = "homelinter-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
homelinter-model = { path = "../model" }
homelinter-scan = { path = "../scan" }
homelinter-analyze = { path = "../analyze" }
homelinter-suggest = { path = "../suggest" }
homelinter-execute = { path = "../execute" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
http-body-util = "0.1"
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
resvg = "0.48.1"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
zip = "2"

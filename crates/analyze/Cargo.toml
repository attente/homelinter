[package]
name = "homelinter-analyze"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
homelinter-model = { path = "../model" }
homelinter-scan = { path = "../scan" }
serde_json = { workspace = true }
chrono = { workspace = true }
kamadak-exif = "0.6.1"
lofty = "0.22"
quick-xml = "0.36"
zip = "2"
pdf-extract = "0.10"
# pdf-extract pulls encoding_rs ^0.8; versions after 0.8.35 require
# rustc 1.88, above this workspace's pinned 1.85 toolchain, so the MSRV-ok
# version is pinned here to keep fresh builds working.
encoding_rs = "=0.8.35"

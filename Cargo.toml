[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/scan",
  "crates/analyze",
  "crates/suggest",
  "crates/execute",
  "crates/service",
  "crates/clients",
  "crates/homelinter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/homelinter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
globset = "=0.4.15"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures-util = "0.3"
axum = "0.8"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
rustix = { version = "0.38", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/scan",
  "crates/analyze",
  "crates/suggest",
  "crates/execute",
  "crates/service",
  "crates/clients",
  "crates/homelinter",
  "crates/launcher",
]
# The desktop shell is a separate workspace: it needs WebKit/GTK on Linux and
# is only built on macOS in CI. Excluding it keeps `cargo build`, `cargo test`,
# and `cargo test --workspace` on a Linux development host free of those
# system libraries. Build it from `crates/desktop` with the Tauri CLI.
# `crates/launcher` (`homelinter-app`) is the Linux counterpart: it needs no
# GUI toolkit because it opens the SPA in an app-mode browser window instead.
exclude = ["crates/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/homelinter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
globset = "=0.4.15"
rayon = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = "0.8"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rustix = { version = "0.38", features = ["fs", "process"] }
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

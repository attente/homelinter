# homelinter configuration template.
# A working example validated against the current schema by the test in
# crates/homelinter/tests/template.rs; it must be updated alongside any
# configuration schema change.
# Use with: homelinter --config defaults.toml
# Placeholders: %Y/%y year, %m/%d month/day, %H/%M/%S hour/minute/second,
# %t title, %a artist/author, %l location, %s description, %c camera,
# %h remote host, %o remote owner, %k asset kind, %f original filename,
# %F normalized name, %n stem, %e extension. See DESIGN.md "Destination
# Path Format Strings" for the full placeholder list and sanitization rules.

[target_paths]
# Destination per asset kind, relative to $HOME (or absolute). Each value
# must contain at least one placeholder. Defaults shown for reference:
document   = "Documents/%a-%t.%e"
photo      = "Images/%Y-%m-%d-%H-%M-%S-%l-%s.%e"
video      = "Videos/%Y-%m-%d-%H-%M-%S-%l-%s.%e"
audio      = "Audio/%a-%t.%e"
repository = "Projects/%o/%n"
archive    = "Archives/%f"
data       = "Data/%f"
executable = "bin/%f"
other      = "Other/%f"

[geocoder]
# Reverse geocoding for GPS-tagged photos (%l). Public services are
# rate-limited (nominatim: 1 req/s). google/mapbox require api_key.
enabled = false
service = "nominatim"       # nominatim | photon | google | mapbox | custom
endpoint = "https://nominatim.openstreetmap.org"
api_key = ""
language = "en"
user_agent_contact = ""     # recommended for public services
# %l renders the city from the provider's structured address; add a city
# name here to use the finer neighbourhood level there instead (matched
# case-insensitively against the provider's city component).
neighbourhood_cities = []
# Applies to every service as an additional floor on its built-in pacing
# (e.g. nominatim 1 req/s -> 1000 ms); custom starts from zero. 0 = none.
# rate_limit_ms = 0

[description]
# Content descriptions for %s (and recovered document titles for %t) via an
# LLM. Requires a reachable provider
# when enabled; model is required then, api_key only for openrouter.
# Per-modality overrides ([description.text], [description.image],
# [description.video], [description.audio]) inherit unset keys from this base
# section, so an override needs only the key it changes, and enabled = false
# suppresses descriptions for that modality.
enabled = false
service = "ollama"          # ollama | openrouter | custom
endpoint = "http://localhost:11434"
model = ""                  # required when enabled = true
api_key = ""                # optional; sent as Authorization: Bearer
max_words = 4                   # maximum words in the generated description
# Optional prompt template; placeholder {words} ({{ }} for literal braces).
# Unset = built-in wording: documents recover the original title first and
# fall back to at most max_words keywords, other modalities use keywords.
# The full file path (carrying the filename) and any extracted document text
# are always included; with text the content comes first and the question
# last so the model answers the question instead of the document.
# prompt = "Describe the file in at most {words} words"
# Longest side in px for photos sent to a vision backend; larger photos are
# downscaled before the request. 0 = forward original bytes.
# max_image_dimension = 1024
# Cap on representative frames sampled from a video for the vision backend:
# about one frame per second, evenly distributed across the clip, thinned to
# at most this many. Must be positive.
# max_video_frames = 8
# Minimum milliseconds between requests (description backends have no
# built-in pacing; requests stay serialized one-in-flight regardless).
# rate_limit_ms = 0

[document_extraction]
# Text extraction before description generation. {path} is the input file;
# commands run directly, never through a shell. Empty array disables a
# format. Defaults: pdftotext for pdf, pandoc for docx/odt/epub.
# pdf  = ["pdftotext", "-layout", "{path}", "-"]
# docx = ["pandoc", "{path}", "-t", "plain"]

[duplication]
# Files above this size (bytes) use the streamed full-content hash path.
large_file_threshold = 104857600

[scan]
# Glob patterns for primary discovery. Patterns with a separator match
# relative to the scan root; without one, match the filename at any depth.
exclude_paths = [".cache/**", "build/**", "node_modules/**"]
# Windows only: explorer (default) | attribute | dotfiles.
# hidden_definition = "explorer"

[output]
format = "pretty"           # pretty | json | toml

[cache]
# Persistent provider cache in the per-user app-data directory.
enabled = true

[limits]
# Bounds on external calls; never infinite. Overruns degrade gracefully.
provider_timeout_seconds = 300
# Provider requests kept in flight at once; 1 = one at a time (safe for any
# backend). Raise it only for a backend that supports parallel inference.
provider_concurrency = 1
tool_timeout_seconds = 30
tool_stdout_max_bytes = 16777216

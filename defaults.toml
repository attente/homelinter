# homelinter configuration defaults.
# A faithful dump of the built-in defaults: every key is shown with its
# effective default value, and loading this file is behaviorally equivalent
# to running with no configuration file at all. The test in
# crates/homelinter/tests/template.rs asserts that equivalence and that every
# key is present, so this file is updated alongside any default change.
# Copy it and change a value to opt in.
# Use with: homelinter --config defaults.toml
# Placeholders: %Y/%y year, %m/%d month/day, %H/%M/%S hour/minute/second,
# %t title, %a artist/author, %l location, %s description, %c camera,
# %h remote host, %o remote owner, %k asset kind, %f original filename,
# %F normalized name, %n stem, %e extension. See DESIGN.md "Destination
# Path Format Strings" for the full placeholder list and sanitization rules.

[target_paths]
# Destination per asset kind, relative to $HOME (or absolute). Each value
# must contain at least one placeholder. These are the built-in defaults:
document   = "Documents/%a-%t.%e"
photo      = "Images/%Y-%m-%d-%H-%M-%S-%l-%s.%e"
video      = "Videos/%Y-%m-%d-%H-%M-%S-%l-%s.%e"
audio      = "Audio/%a-%t.%e"
repository = "Projects/%o/%n"
# Archives keep their original filename (which carries version/source
# identity) under a year/month nest dated from the file's modification
# time. Installer packages (dmg, deb, rpm, apk, msi, exe, bin) classify as
# archives too. Data, source, script, and unknown files are unmanaged and
# are never moved or deduplicated.
archive    = "Archives/%Y/%m/%f"

[geocoder]
# Reverse geocoding for GPS-tagged photos (%l). Disabled by default.
enabled = false
service = "nominatim"       # nominatim | photon | google | mapbox | custom
endpoint = "https://nominatim.openstreetmap.org"
# api_key and user_agent_contact are unset by default; language defaults to
# "en". api_key is required by google/mapbox and optional for custom;
# language is an ISO 639-1 code passed to the provider; user_agent_contact
# is recommended for public services.
# api_key = ""
language = "en"
# user_agent_contact = ""
# %l renders the city from the provider's structured address; add a city
# name here to use the finer neighbourhood level there instead (matched
# case-insensitively against the provider's city component).
neighbourhood_cities = []
# Additional floor on the service's built-in pacing (e.g. nominatim 1 req/s
# -> 1000 ms); custom starts from zero. 0 = none.
rate_limit_ms = 0

[description]
# Content descriptions for %s (and recovered document titles for %t) via an
# LLM. Disabled by default, so no provider is contacted. Per-modality
# overrides ([description.text], [description.image], [description.video],
# [description.audio]) inherit unset keys from this base section.
enabled = false
service = "ollama"          # ollama | openrouter | custom
endpoint = "http://localhost:11434"
# model and api_key are unset by default. model is required once enabled;
# api_key is required by openrouter and sent as Authorization: Bearer.
# model = ""
# api_key = ""
max_words = 4                   # maximum words in the generated description
# prompt is unset by default (built-in wording). Placeholder {words}; {{ }}
# escapes literal braces. The full path (with the filename) and any extracted
# document text are always included.
# prompt = ""
# Longest side in px for photos sent to a vision backend; larger photos are
# downscaled before the request. 0 = forward original bytes.
max_image_dimension = 1024
# Cap on representative frames sampled from a video for the vision backend:
# about one frame per second, evenly distributed across the clip, thinned to
# at most this many. Must be positive.
max_video_frames = 8
# Upper bound on the ollama context window (num_ctx) requested per
# description; the window is sized from the request payload (images plus
# prompt and completion budget). Lower it for a small-context model; must be
# positive.
max_context = 32768
# Minimum milliseconds between requests (description backends have no
# built-in pacing; requests stay serialized one-in-flight regardless).
rate_limit_ms = 0

[document_extraction]
# Text extraction before description generation. There is no static default:
# the runtime selects pdftotext for pdf and pandoc for docx/odt/epub when the
# tool is on the PATH, and otherwise an in-process reader. Set a format key to
# a command to override it, or to [] to disable extraction for that format.
# {path} is the input file; commands run directly, never through a shell.
# pdf  = ["pdftotext", "-layout", "{path}", "-"]
# docx = ["pandoc", "{path}", "-t", "plain"]

[duplication]
# Files above this size (bytes) use the streamed full-content hash path.
large_file_threshold = 104857600

[scan]
# Extra glob patterns for primary discovery, merged with the built-in defaults
# below unless default_exclusions is false. Patterns without a path separator
# match a component at any depth, pruning matching directories and subtrees.
exclude_paths = []
# The built-in exclusions are conventional dependency, cache, and build-output
# directories that are usually reproducible artifacts, not personal files:
# node_modules, vendor, .venv, venv, __pycache__, .pytest_cache, .mypy_cache,
# .ruff_cache, target, build, dist, .gradle, .m2, .next, .nuxt, .terraform,
# Pods, and DerivedData. A user pattern is added to these, never replacing
# them; prefix a built-in name with '!' to re-include just that directory
# (for example "!build"). Set default_exclusions = false to drop all built-ins
# and use only the positive patterns. Broad names such as build and dist may
# also be meaningful user directories, so re-include them with "!build" or
# "!dist" when that matters.
# default_exclusions = true
# Extensions excluded from discovery at any depth, without a leading dot and
# matched case-insensitively (e.g. ["png"] skips a.png and PHOTO.PNG).
exclude_extensions = []
# Windows only: explorer (default) | attribute | dotfiles.
hidden_definition = "explorer"

[output]
format = "pretty"           # pretty | json | toml

[cache]
# Persistent provider cache in the per-user app-data directory.
enabled = true

[limits]
# Bounds on external calls; never infinite. Overruns degrade gracefully.
provider_timeout_seconds = 300
# Provider requests kept in flight at once; 1 = one at a time (safe for any
# backend). Raise it only for a backend that supports parallel inference.
provider_concurrency = 1
tool_timeout_seconds = 30
tool_stdout_max_bytes = 16777216
